# Blueprint de Render para la web de Inport.
# Es un sitio estático: Render compila con Node y sirve build/client desde su CDN. No hay servidor encendido.
# Uso: Render > New > Blueprint > elegir el repositorio InportGroup/inportgroup-website > aplicar.
#
# Despliega la rama main. La web pública se sirve hoy desde GitHub Pages; Render queda como alternativa.

services:
  - type: web
    name: inport-web
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build/client
    envVars:
      # React Router 8 pide Node 22.22 o superior; Render instala la última 22 con esto.
      - key: NODE_VERSION
        value: "22"
    headers:
      # Los archivos de Vite llevan hash en el nombre: se pueden cachear un año.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # El HTML nunca se cachea, para que un despliegue se vea al momento.
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # El laboratorio de escenas es interno: que no se indexe aunque alguien lo enlace.
      - path: /laboratorio/*
        name: X-Robots-Tag
        value: noindex, nofollow
